# Publishes docs/user/ to GitHub Pages on every push to main that touches it.
#
# The site root IS docs/user/, so https://potatobeanradio.github.io/circuitRF/
# lands on the documentation index. Nothing else under docs/ is served: the
# design notes, the PRD and the briefs stay repo-only.
#
# There is NO build step. docs/user/ is generated by tools/DocGen and committed,
# exactly as the application ships it, so what the web serves is byte for byte
# what Help opens locally. Regenerating is a separate, deliberate act:
#     dotnet run --project tools/DocGen -- --out docs/user
# then commit the result; this workflow only publishes what is already in main.
name: User docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/user/**'
      - '.github/workflows/user-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages exists on the upstream repository. Any other copy (a fork, a private
    # mirror) has no Pages site unless its owner turns one on, and the deploy then
    # fails at configure-pages on every push. There it publishes only when the
    # repository variable PUBLISH_USER_DOCS is 'true' (Settings > Secrets and
    # variables > Actions > Variables), set after enabling Pages.
    if: github.repository == 'potatobeanradio/circuitRF' || vars.PUBLISH_USER_DOCS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload docs/user as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/user

      - id: deployment
        uses: actions/deploy-pages@v4
